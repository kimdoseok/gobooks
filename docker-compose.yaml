services:
  redisdb:
    image: "redis:latest"
    container_name: redis-service
    restart: always
    ports:
      - "6379:6379"
        
  postgresdb:
    image: postgres:alpine
    hostname: postgresdb
    container_name: postgresdb 
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PGSQL_PASSWORD}
      POSTGRES_DB: ${DB_PGSQL_DBNAME}
      DB_PGSQL_HOST: ${DB_PGSQL_HOST}
      DB_PGSQL_USER: ${DB_PGSQL_USER}
      DB_PGSQL_PASSWORD: ${DB_PGSQL_PASSWORD}
      DB_PGSQL_DBNAME: ${DB_PGSQL_DBNAME}
      DB_PGSQL_PORT: ${DB_PGSQL_PORT}
    volumes: 
      - ./storage/postgres:/var/lib/postgresql
      # copy the sql script to create tables
      - ./postgres/entrypoint:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:latest # Use the official pgAdmin 4 image
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${DB_PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${DB_PGADMIN_PASSWORD}
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: 100
    restart: always
    ports:
      - "80:80" # Expose pgAdmin on port 8080 of the host
    depends_on:
      - "postgresdb" # Ensure PostgreSQL starts before pgAdmin
    volumes:
      - ./storage/pgadmin:/var/lib/pgadmin

  grpc-service:
    container_name: grpc-service
    restart: always
    env_file: 
      - .env
    depends_on:
      - "postgresdb"  
      - "redisdb"
    ports:
      - "50051:50051"
      - "8080:8080"
    build:
      context: ./grpcserv
      dockerfile: Dockerfile
      args:
        buildno: 1
    volumes:
      - "./storage/log:/grpcserv/log"
      #- "./storage/sqlite:/app/sqlite"

  goapp:
    container_name: goapp-service
    build:
      context: ./goapp
      dockerfile: Dockerfile

    env_file: .env
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - "redisdb"
      - "postgresdb"
