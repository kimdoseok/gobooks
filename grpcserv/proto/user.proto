syntax = "proto3";
package user;

option go_package = "grpcserv/pb";


import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service UserService {
  rpc GetUserById (UserRequest) returns (UserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{id}"
    };
  }
  rpc GetUserByCode (UserRequest) returns (UserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/code/{yus_code}"
    };
  }
  rpc GetUserByLogin (UserLoginRequest) returns (UserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/login"
      body: "*"
    };
  }
  rpc AddUser (UserAddRequest) returns (UserResultResponse) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "*"
    };
  }
  rpc SetUser (UserSetRequest) returns (UserResultResponse) {
    option (google.api.http) = {
      put: "/api/v1/users/{id}"
      body: "*"
    };
  }
  rpc GetUserList (UserListRequest) returns (UserListResponse) {
    option (google.api.http) = {
      get: "/api/v1/users"
    };
  }
  rpc GetUserCount (UserListRequest) returns (UserCountResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/count"
    };
  }
  rpc DeleteUserById (UserRequest) returns (UserResultResponse) {
    option (google.api.http) = {
      delete: "/api/v1/users/{id}"
    };
  }
  rpc DeleteUserByCode (UserRequest) returns (UserResultResponse) {
    option (google.api.http) = {
      delete: "/api/v1/users/code/{yus_code}"
    };
  }
}

// yus_usergroups

message UserRequest { 
  int64 id = 1; 
  string yus_code = 2; 
}

message UserLoginRequest { 
  string yus_code = 1; 
  string yus_passwd = 2; 
}

message UserAddRequest { 
  string yus_code = 1; 
  string yus_passwd = 2;
  string yus_name = 3; 
  string yus_memo = 4; 
  bool yus_active = 5;
}
message UserSetRequest { 
  int64 id = 1; 
  string yus_code = 2; 
  string yus_passwd = 3;
  string yus_name = 4; 
  string yus_memo = 5; 
  bool yus_active = 6; 
}
message UserPasswdSetRequest { 
  string yus_code = 1; 
  string yus_passwd = 2;
}
message UserListRequest { 
  string filter = 1; 
  int64 page =2;

}
message UserResponse { 
  int64 id = 1; 
  string yus_code = 2; 
  string yus_name = 3; 
  string yus_memo = 4; 
  bool yus_active = 5; 
  google.protobuf.Timestamp createdAt = 6;
  google.protobuf.Timestamp UpdatedAt = 7;
  google.protobuf.Timestamp DeletedAt = 8; 

}
message UserListResponse { 
  repeated UserResponse usergroups = 1; 
}
message UserCountResponse { 
  int64 count = 1; 
}
message UserResultResponse { 
  int64 id = 1;
  bool success = 2; 
}

